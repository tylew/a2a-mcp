[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-mcp"
version = "0.1.0"
description = "A light, dependency-free MCP server that lets MCP clients (Claude Code, Claude Desktop, Cursor) talk to A2A agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["mcp", "a2a", "agent-to-agent", "claude", "model-context-protocol"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/tylew/a2a-mcp"

[project.scripts]
a2a-mcp = "a2a_mcp:main"

[tool.setuptools]
py-modules = ["a2a_mcp"]
